<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A short page summary for search engines." />
    <title>Tools in Table Format</title>
  </head>
  <body>
<table>
  <caption>My tools</caption>
  <thead>
    <tr>
      <th scope="col">Tool</th>
      <th scope="col">Comfort</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">HTML</th>
      <td>Strong</td>
    </tr>
    <tr>
      <th scope="row">CSS</th>
      <td>Beginner</td>
    </tr>
    <tr>
      <th scope="row">Git</th>
      <td>Comfortable</td>
    </tr>
  </tbody>
</table>

  </body>
</html>
