<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Engineering Portfolio | Imran Lateef Unar</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }

    header p {
      color: var(--muted);
      font-size: 1rem;
    }

    .course-grid {
      display: grid;
      gap: 1.75rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .badge-completed {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .badge-upcoming {
      background: rgba(148, 163, 184, 0.15);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 1rem 0 0.5rem;
    }

    .link-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .link-list button,
    .link-list a {
      color: var(--accent);
      background: none;
      border: none;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0;
      transition: color 0.2s;
    }

    .link-list button:hover,
    .link-list a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .pill-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .pill {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .pill:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Embedded Inline Document Viewer */
    #viewer-container {
      display: none;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .viewer-header span {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--accent);
    }

    .btn-close {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 0.35rem 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }

    .btn-close:hover {
      background: #475569;
    }

    #doc-frame {
      width: 100%;
      height: 650px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>Web Engineering Coursework</h1>
    <p>Repository by <strong>IMRAN LATEEF UNAR</strong></p>
  </header>

  <main class="course-grid">
    <!-- Week 01 -->
    <section class="card">
      <h2>

      <ul class="link-list">            <!-- Ensure you save your .mhtml page as .html so browsers can render it directly -->
          <button type="button" onclick="loadContent('week01/course-outline.html', 'COURSE OUTLINES')">
            🌐 COURSE OUTLINES
          </button>
        </li>
      </ul>
      </h2>
      <span class="status-badge badge-completed">Completed</span>
      <h2>
        Week 01: How the Web Works
        <span class="status-badge badge-completed">Completed</span>
      </h2>

      <div class="section-title">Documents & Notes</div>
      <ul class="link-list">
        <li>
          <button type="button" onclick="loadContent('week01/Week01_easynotes.html', 'Week 01 Easy Notes')">
            📄 Week 01 Easy Notes
          </button>
        </li>
        <li>
          <button type="button" onclick="loadContent('week01/Week01_tasks.html', 'Week 01 Tasks Page')">
            📝 Week 01 Tasks Solutions
          </button>
        </li>
        <li>
          <!-- Ensure you save your .mhtml page as .html so browsers can render it directly -->
          <button type="button" onclick="loadContent('week01/week-01-how-the-web-works.html', 'Article: How the Web Works')">
            🌐 How the Web Works (Web Page)
          </button>
        </li>
      </ul>

      <div class="section-title">Task Snapshots & Diagrams</div>
      <div class="pill-grid">
        <button class="pill" type="button" onclick="loadContent('week01/001.png', 'Preview: 001.png')">001.png</button>
        <button class="pill" type="button" onclick="loadContent('week01/task_A.png', 'Preview: Task A')">Task A</button>
        <button class="pill" type="button" onclick="loadContent('week01/task_C.png', 'Preview: Task C')">Task C</button>
        <button class="pill" type="button" onclick="loadContent('week01/task_D.png', 'Preview: Task D')">Task D</button>
        <button class="pill" type="button" onclick="loadContent('week01/task_E.png', 'Preview: Task E')">Task E</button>
        <button class="pill" type="button" onclick="loadContent('week01/task_F.png', 'Preview: Task F')">Task F</button>
        <button class="pill" type="button" onclick="loadContent('week01/task_G.png', 'Preview: Task G')">Task G</button>
      </div>

      <!-- Live Viewer Container inside Week 01 -->
      <div id="viewer-container">
        <div class="viewer-header">
          <span id="viewer-title">Document Preview</span>
          <button class="btn-close" type="button" onclick="closeViewer()">Close Preview ✕</button>
        </div>
        <iframe id="doc-frame" src="" title="Content Preview"></iframe>
      </div>
    </section>

    <!-- Week 02 Placeholder -->
    <section class="card">
      <h2>
        Week 02
        <span class="status-badge badge-upcoming">In Progress</span>
      </h2>
      <p style="color: var(--muted); font-size: 0.9rem;">
        Upcoming modules, tasks, and lab submissions will be linked here.
      </p>
    </section>
  </main>

  <script>
    function loadContent(filePath, title) {
      const container = document.getElementById("viewer-container");
      const frame = document.getElementById("doc-frame");
      const titleElement = document.getElementById("viewer-title");

      titleElement.textContent = title;
      frame.src = filePath;
      container.style.display = "block";
      container.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function closeViewer() {
      const container = document.getElementById("viewer-container");
      const frame = document.getElementById("doc-frame");

      frame.src = "";
      container.style.display = "none";
    }
  </script>

</body>
</html>
